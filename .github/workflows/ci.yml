name: Android CI

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master", "develop" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Assemble Debug Variants (Play & F-Droid)
        run: ./gradlew assemblePlayDebug assembleFdroidDebug

      - name: Run Unit Tests (Core Modules & Flavors)
        run: >-
          ./gradlew
          :dbcore:test
          :sync-core:test
          :sync-webdav:test
          :sync-local:test
          :sync-gdrive:test
          :app:testPlayDebugUnitTest
          :app:testFdroidDebugUnitTest
          -Pfastlane.screenshots=false

      - name: Run Android Lint
        run: ./gradlew lint
