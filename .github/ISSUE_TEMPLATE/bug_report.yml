name: "🐛 Bug Report"
description: "Report an issue, crash, or unexpected behavior in Dispensa / Segnala un errore nell'app."
title: "[BUG]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Grazie per l'aiuto nel migliorare **Dispensa**! / *Thank you for helping improve Dispensa!*
        Prima di inviare, controlla che non ci sia già una segnalazione simile aperta.

  - type: dropdown
    id: app-version-source
    attributes:
      label: "Install Source / Fonte di installazione"
      description: "Where did you install the app from?"
      options:
        - "Google Play Store"
        - "F-Droid"
        - "GitHub Release (APK)"
        - "Built from source"
    validations:
      required: true

  - type: input
    id: app-version
    attributes:
      label: "App Version / Versione dell'applicazione"
      description: "Found at the bottom of Settings screen / Visibile in fondo alle Impostazioni"
      placeholder: "e.g. 0.1.15 (Build 25)"
    validations:
      required: true

  - type: input
    id: device-os
    attributes:
      label: "Device & Android Version / Dispositivo e versione Android"
      placeholder: "e.g. Google Pixel 7 - Android 14"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: "Description / Descrizione del problema"
      description: "A clear and concise description of the bug."
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: "Steps to Reproduce / Passi per riprodurre il problema"
      description: "How can we reproduce the issue?"
      value: |
        1. Open '...'
        2. Tap on '...'
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: "Expected Behavior / Comportamento atteso"
      description: "What did you expect to happen?"
    validations:
      required: false

  - type: textarea
    id: logs-screenshots
    attributes:
      label: "Screenshots or Logs / Screenshot o Log (optional)"
      description: "Drag & drop screenshots or paste log messages here."
    validations:
      required: false
